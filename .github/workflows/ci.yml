name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    # WPF (UseWPF) requires the Windows SDK reference assemblies, so this can't run on
    # ubuntu/macos runners - windows-latest is the only option.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Cutwright.sln

      - name: Build
        run: dotnet build Cutwright.sln -c Release --no-restore

